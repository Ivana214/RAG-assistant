<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAGzhiyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: {
                light: "#f7f7f8",
                dark: "#171717",
              },
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        height: 100%;
      }
      .chat-scroll {
        scrollbar-width: thin;
        scrollbar-color: #cbd5e1 transparent;
      }
      .dark .chat-scroll {
        scrollbar-color: #525252 transparent;
      }
      .loading-dots span {
        animation: bounce 1.2s infinite ease-in-out;
      }
      .loading-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.45;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }
      .drop-active {
        border-color: #16a34a;
        background-color: rgba(22, 163, 74, 0.08);
      }
    </style>
  </head>
  <body class="bg-white text-neutral-900 dark:bg-neutral-900 dark:text-neutral-100">
    <header
      class="flex h-14 items-center justify-between border-b border-neutral-200 px-4 dark:border-neutral-800 dark:bg-neutral-900"
    >
      <div class="flex items-center gap-2">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-600 text-white"
        >
          <i data-lucide="book-open" class="h-4 w-4"></i>
        </span>
        <div class="leading-tight">
          <h1 class="text-sm font-semibold">RAGzhiyan</h1>
          <p class="text-xs text-neutral-500 dark:text-neutral-400">
            本地知识智能问答
          </p>
        </div>
      </div>
      <button
        id="themeToggle"
        type="button"
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-neutral-200 text-neutral-600 hover:bg-neutral-100 dark:border-neutral-700 dark:text-neutral-300 dark:hover:bg-neutral-800"
        title="切换主题"
      >
        <i data-lucide="sun" id="themeIconSun" class="h-4 w-4 hidden"></i>
        <i data-lucide="moon" id="themeIconMoon" class="h-4 w-4"></i>
      </button>
    </header>

    <main class="flex min-h-[calc(100vh-3.5rem)] flex-col lg:flex-row">
      <aside
        class="w-full border-b border-neutral-200 p-5 dark:border-neutral-800 lg:w-[38%] lg:border-b-0 lg:border-r xl:w-[34%]"
      >
        <div class="mb-4">
          <h2 class="text-sm font-semibold">上传文档</h2>
          <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">
            拖入 PDF，解析后自动向量化入库
          </p>
        </div>

        <div
          id="dropZone"
          class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-neutral-300 px-6 py-10 text-center transition-colors hover:border-emerald-500 hover:bg-emerald-50/40 dark:border-neutral-700 dark:hover:bg-emerald-950/20"
        >
          <i data-lucide="file-up" class="mb-3 h-8 w-8 text-emerald-600"></i>
          <p class="text-sm font-medium">拖拽 PDF 到这里</p>
          <p class="mt-1 text-xs text-neutral-500 dark:text-neutral-400">
            或点击选择文件
          </p>
          <input id="fileInput" type="file" accept=".pdf,application/pdf" class="hidden" />
        </div>

        <div class="mt-5">
          <h3 class="text-xs font-medium uppercase tracking-wide text-neutral-400">
            文件列表
          </h3>
          <div id="fileList" class="mt-2 space-y-2"></div>
        </div>
      </aside>

      <section class="flex min-h-0 flex-1 flex-col">
        <div
          id="chatMessages"
          class="chat-scroll flex-1 space-y-5 overflow-y-auto px-4 py-6"
        ></div>
        <div class="border-t border-neutral-200 p-4 dark:border-neutral-800">
          <form id="chatForm" class="flex items-end gap-2">
            <textarea
              id="questionInput"
              rows="1"
              placeholder="输入问题，例如：什么是马克思主义中国化？"
              class="max-h-36 min-h-[44px] flex-1 resize-none rounded-xl border border-neutral-300 bg-white px-4 py-3 text-sm outline-none focus:border-emerald-500 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-100"
            ></textarea>
            <button
              id="sendButton"
              type="submit"
              class="flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-600 text-white transition-colors hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50"
              title="发送"
            >
              <i data-lucide="send" class="h-5 w-5"></i>
            </button>
          </form>
        </div>
      </section>
    </main>

    <script>
      const state = {
        files: [],
        messages: [],
        thinking: false,
      };

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileList = document.getElementById("fileList");
      const chatMessages = document.getElementById("chatMessages");
      const chatForm = document.getElementById("chatForm");
      const questionInput = document.getElementById("questionInput");
      const sendButton = document.getElementById("sendButton");
      const themeToggle = document.getElementById("themeToggle");
      const themeIconSun = document.getElementById("themeIconSun");
      const themeIconMoon = document.getElementById("themeIconMoon");

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function refreshIcons() {
        if (window.lucide) {
          lucide.createIcons();
        }
      }

      function applyTheme() {
        const stored = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const dark = stored === "dark" || (!stored && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
        themeIconSun.classList.toggle("hidden", !dark);
        themeIconMoon.classList.toggle("hidden", dark);
      }

      function toggleTheme() {
        const dark = document.documentElement.classList.contains("dark");
        localStorage.setItem("theme", dark ? "light" : "dark");
        applyTheme();
      }

      function formatStatus(status) {
        return status || "排队中";
      }

      function renderFiles() {
        if (state.files.length === 0) {
          fileList.innerHTML =
            '<p class="text-xs text-neutral-400">暂无上传文件</p>';
          return;
        }
        fileList.innerHTML = state.files
          .map((file) => {
            const percent =
              file.total_chunks > 0
                ? Math.round((file.processed_chunks / file.total_chunks) * 100)
                : 0;
            const progressText =
              file.total_chunks > 0
                ? `已处理 ${file.processed_chunks} / ${file.total_chunks} 块`
                : formatStatus(file.status);
            const statusColor =
              file.status === "失败"
                ? "text-red-500"
                : file.status === "已完成"
                  ? "text-emerald-600"
                  : "text-neutral-500 dark:text-neutral-400";
            const errorHtml = file.error
              ? `<p class="mt-1 truncate text-xs text-red-500" title="${escapeHtml(file.error)}">${escapeHtml(file.error)}</p>`
              : "";
            return `
              <div class="rounded-lg border border-neutral-200 p-3 dark:border-neutral-800">
                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <p class="truncate text-sm font-medium">${escapeHtml(file.filename)}</p>
                    <p class="mt-0.5 text-xs ${statusColor}">${progressText}</p>
                  </div>
                  <span class="shrink-0 text-xs ${statusColor}">${escapeHtml(formatStatus(file.status))}</span>
                </div>
                ${
                  file.total_chunks > 0 && file.status !== "失败"
                    ? `<div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-neutral-200 dark:bg-neutral-700">
                        <div class="h-full rounded-full bg-emerald-600 transition-all" style="width: ${percent}%"></div>
                      </div>`
                    : ""
                }
                ${errorHtml}
              </div>
            `;
          })
          .join("");
      }

      function renderChat() {
        const blocks = state.messages
          .map((message) => {
            if (message.role === "user") {
              return `
                <div class="flex justify-end">
                  <div class="max-w-[82%] rounded-2xl bg-emerald-600 px-4 py-3 text-sm text-white">
                    ${escapeHtml(message.content)}
                  </div>
                </div>
              `;
            }
            if (message.thinking) {
              return `
                <div class="flex justify-start">
                  <div class="max-w-[82%] rounded-2xl bg-neutral-100 px-4 py-3 text-sm dark:bg-neutral-800">
                    <span class="flex items-center gap-2 text-neutral-500 dark:text-neutral-400">
                      <span class="loading-dots flex items-center gap-1">
                        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
                        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
                        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
                      </span>
                      正在思考...
                    </span>
                  </div>
                </div>
              `;
            }
            const sources = (message.sources || [])
              .map(
                (source) => `
                  <div class="mt-1 rounded-md bg-neutral-100/80 px-2 py-1.5 text-xs text-neutral-500 dark:bg-neutral-800/80 dark:text-neutral-400">
                    <p class="font-medium text-neutral-600 dark:text-neutral-300">
                      ${escapeHtml(source.filename)} · 第 ${source.page_number} 页 · 相似度 ${source.score.toFixed(2)}
                    </p>
                    <p class="mt-0.5 line-clamp-2 text-neutral-500 dark:text-neutral-400">
                      ${escapeHtml(source.snippet)}
                    </p>
                  </div>
                `,
              )
              .join("");
            return `
              <div class="flex justify-start">
                <div class="max-w-[82%] rounded-2xl bg-neutral-100 px-4 py-3 text-sm dark:bg-neutral-800">
                  <div class="whitespace-pre-wrap">${escapeHtml(message.content)}</div>
                  ${
                    sources
                      ? `<div class="mt-3 space-y-1 border-t border-neutral-200 pt-2 dark:border-neutral-700">${sources}</div>`
                      : ""
                  }
                </div>
              </div>
            `;
          })
          .join("");
        chatMessages.innerHTML = blocks;
        chatMessages.scrollTop = chatMessages.scrollHeight;
        refreshIcons();
      }

      function uploadFile(file) {
        if (!file.name.toLowerCase().endsWith(".pdf")) {
          alert("只支持上传 PDF 文件");
          return;
        }
        const record = {
          id:
            window.crypto && window.crypto.randomUUID
              ? window.crypto.randomUUID()
              : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          filename: file.name,
          status: "排队中",
          processed_chunks: 0,
          total_chunks: 0,
          error: null,
          task_id: null,
        };
        state.files.unshift(record);
        renderFiles();

        const formData = new FormData();
        formData.append("file", file);
        fetch("/documents/upload", { method: "POST", body: formData })
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.detail || "上传失败");
            }
            record.task_id = data.task_id;
            pollTask(record.id);
          })
          .catch((error) => {
            record.status = "失败";
            record.error = error.message;
            renderFiles();
          });
      }

      function pollTask(fileId) {
        const file = state.files.find((item) => item.id === fileId);
        if (!file || !file.task_id) {
          return;
        }
        fetch(`/documents/status/${file.task_id}`)
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.detail || "查询任务状态失败");
            }
            file.status = data.status;
            file.processed_chunks = data.processed_chunks || 0;
            file.total_chunks = data.total_chunks || 0;
            file.error = data.error || null;
            renderFiles();
            if (data.status !== "已完成" && data.status !== "失败") {
              setTimeout(() => pollTask(fileId), 1200);
            }
          })
          .catch((error) => {
            file.status = "失败";
            file.error = error.message;
            renderFiles();
          });
      }

      function setThinking(active) {
        state.thinking = active;
        if (active) {
          state.messages.push({
            role: "assistant",
            content: "",
            sources: [],
            thinking: true,
          });
        } else {
          const index = state.messages.findIndex((item) => item.thinking);
          if (index !== -1) {
            state.messages.splice(index, 1);
          }
        }
        sendButton.disabled = active;
        renderChat();
      }

      function sendQuestion(question) {
        state.messages.push({ role: "user", content: question });
        setThinking(true);
        fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, top_k: 4 }),
        })
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.detail || "问答请求失败");
            }
            setThinking(false);
            state.messages.push({
              role: "assistant",
              content: data.answer || "未获取到回答",
              sources: data.sources || [],
              thinking: false,
            });
            renderChat();
          })
          .catch((error) => {
            setThinking(false);
            state.messages.push({
              role: "assistant",
              content: `请求失败：${error.message}`,
              sources: [],
              thinking: false,
            });
            renderChat();
          });
      }

      dropZone.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        Array.from(fileInput.files || []).forEach(uploadFile);
        fileInput.value = "";
      });
      dropZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropZone.classList.add("drop-active");
      });
      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("drop-active");
      });
      dropZone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropZone.classList.remove("drop-active");
        Array.from(event.dataTransfer.files || []).forEach(uploadFile);
      });

      chatForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = questionInput.value.trim();
        if (!question || state.thinking) {
          return;
        }
        questionInput.value = "";
        questionInput.style.height = "auto";
        sendQuestion(question);
      });

      questionInput.addEventListener("input", () => {
        questionInput.style.height = "auto";
        questionInput.style.height = `${Math.min(questionInput.scrollHeight, 144)}px`;
      });

      questionInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          chatForm.requestSubmit();
        }
      });

      themeToggle.addEventListener("click", toggleTheme);

      applyTheme();
      renderFiles();
      renderChat();
    </script>
  </body>
</html>
